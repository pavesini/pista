syntax = "proto3";

package pista.transactions.v1;

message Transaction {
  uint64 block_number = 1;
  uint64 block_timestamp = 2;
  string tx_hash = 3;      // 0x-prefixed lowercase hex
  string from = 4;         // 0x-prefixed lowercase hex
  string to = 5;           // 0x-prefixed lowercase hex ("" for contract-creation txs)
  string value = 6;        // wei, decimal string
  uint64 nonce = 7;
  uint32 index = 8;        // transaction index within the block
}

message Transactions {
  repeated Transaction transactions = 1;
}
