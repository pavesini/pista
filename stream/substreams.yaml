specVersion: v0.1.0
package:
  name: pista_wallet_transactions
  version: v0.1.0
  url: https://github.com/pavesini/pista
  description: Map Eth Blocks into per-block FraudData aggregates

network: sepolia

protobuf:
  files:
    - aggregate.proto
  importPaths:
    - ./proto
  excludePaths:
    - google
    - sf/substreams
  descriptorSets:
    - module: buf.build/streamingfast/substreams-sink-sql

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/pista_wallet_transactions.wasm

modules:
  - name: store_block_interval
    kind: store
    initialBlock: 0
    updatePolicy: set
    valueType: int64
    inputs:
      - source: sf.ethereum.type.v2.Block

  - name: extract_fraud_relevant_data
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_block_interval
        mode: deltas
    output:
      type: proto:pista.aggregate.v1.FraudData

sink:
  module: extract_fraud_relevant_data
  type: sf.substreams.sink.sql.service.v1.Service
  config:
    engine: clickhouse
