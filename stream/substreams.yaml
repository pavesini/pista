specVersion: v0.1.0
package:
  name: pista_wallet_transactions
  version: v0.1.0
  url: https://github.com/pavesini/pista
  description: Map Eth Blocks and Transactions

network: testnet

protobuf:
  files:
    - transactions.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/pista_wallet_transactions.wasm

modules:
  - name: extract_fraud_relevant_data
    kind: map
    initialBlock: 0
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:pista.transactions.v1.Transactions
